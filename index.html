
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #050505;
        color: #00ff9d;
        font-family: "Courier New", monospace;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 30px 20px 60px;
    }

    h1 {
        text-align: center;
        letter-spacing: 4px;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 40px;
    }

    .system {
        border: 1px solid #00ff9d;
        padding: 20px;
        margin-bottom: 30px;
    }

    .question {
        border: 1px solid #333;
        padding: 20px;
        margin-bottom: 25px;
        background: #080808;
    }

    .question h2 {
        color: white;
        font-size: 18px;
    }

    .question img {
        display: block;
        max-width: 100%;
        margin: 15px auto;
    }

    label {
        display: block;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #333;
        cursor: pointer;
    }

    label:hover {
        border-color: #00ff9d;
    }

    input {
        margin-right: 10px;
    }

    button {
        display: block;
        width: 100%;
        padding: 18px;
        background: transparent;
        border: 1px solid #00ff9d;
        color: #00ff9d;
        font-family: inherit;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #00ff9d;
        color: #000;
    }

    #quiz {
        display: none;
    }

    #result {
        margin-top: 30px;
        padding: 25px;
        text-align: center;
        display: none;
        border: 1px solid #00ff9d;
    }

    #result a {
        display: inline-block;
        margin-top: 20px;
        padding: 15px 30px;
        border: 1px solid #00ff9d;
        color: #00ff9d;
        text-decoration: none;
    }

    #result a:hover {
        background: #00ff9d;
        color: #000;
    }

    .success {
        color: #00ff9d;
    }

    .failure {
        color: #ff4444;
    }
   .squares {
        display: flex;
        gap: clamp(3px, 2vw, 10px);
   }

   .squares span {
      width: clamp(30px, 8vw, 80px);
          flex: 0 1 auto;
          aspect-ratio: 1 / 1;
        border: 3px solid white;
      box-sizing: border-box;
   }

   .squares .red {
      border: 3px solid red;
   }
   .space {
       margin-right: clamp(10px, 5vw, 50px);
   }
   .squares .big {
       width: clamp(40px, 10vw, 100px);
       aspect-ratio: 1 / 1;
       flex-shrink: 1;
   }
   @media (max-width: 600px) {

  body {
    padding: 10px;
  }

  .container {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }

  .question {
    margin-bottom: 30px;
  }

  .question p {
    font-size: 20px;
    line-height: 1.6;
  }

  label {
    font-size: 18px;
    margin-bottom: 12px;
  }

  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    font-size: 18px;
    padding: 12px;
  }

  button {
    font-size: 18px;
    padding: 14px 25px;
  }

  .squares {
    max-width: 100%;
    overflow-x: auto;
  }
}
</style>
</head>

<body>

<div class="container">
    <!-- 最初の画面 -->
    <div id="startScreen">
        <button onclick="startConfirmation()">
            START 
        </button>

    </div>


    <!-- クイズ -->
    <div id="quiz">
        <!-- Q1 -->
        <div class="question">
            <h2>1.</h2>
           <img src="images/q1.png">
           <div class="squares">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span class="red"></span>
              <span></span>
           </div>
          <input
              type="text"
               name="q1"
             >
        </div>


        <!-- Q2 -->
        <div class="question">
            <h2>2. </h2>
            <h2 style="font-size: 24px;"> SOTIF</h2>
            <h2 style="font-size: 24px;"> ISO</h2>
               <div class="squares">
                 <span></span>
                 <span></span>
                 <span class="red"></span>
                 <span></span>
                 <span></span>
              </div>
          <input
              type="text"
              name="q2"
             >
        </div>


        <!-- Q3 -->
        <div class="question">
            <h2>Q3. この画像から読み取れるものは？</h2>

            <!-- あとで画像を変更 -->
            <img src="images/q3.jpg" alt="問題3の画像">

            <label>
                <input type="radio" name="q3" value="A">
                A. 道路
            </label>

            <label>
                <input type="radio" name="q3" value="B">
                B. 海
            </label>

            <label>
                <input type="radio" name="q3" value="C">
                C. 宇宙
            </label>

            <label>
                <input type="radio" name="q3" value="S">
                D. 山
            </label>
        </div>


        <!-- Q4 -->
        <div class="question">
            <h2>4.</h2>
            <h2 style="font-size: 24px;"> ピーポーピーポー</h2>

           <div class="squares">
              <span class="red"></span>
              <span></span>
              <span></span>
           </div>
            <h2 style="font-size: 24px;"> Hz/</h2>
           <div class="squares">
              <span class="red"></span>
              <span></span>
              <span></span>
           </div>
            <h2 style="font-size: 24px;"> Hz</h2>
            <label>
                <input type="radio" name="q4" value="A">
                A. 1/2
            </label>

            <label>
                <input type="radio" name="q4" value="B">
                B. 3/6
            </label>

            <label>
                <input type="radio" name="q4" value="C">
                C. 4/7
            </label>

            <label>
                <input type="radio" name="q4" value="D">
                D. 6/7
            </label>
           <label>
                <input type="radio" name="q4" value="E">
                E. 7/9
            </label>
        </div>


        <!-- Q5 -->
        <div class="question">
            <h2>5. </h2>

            <!-- あとで画像を変更 -->
            <img src="images/q5.jpg" alt="問題5の画像">

            <label>
                <input type="radio" name="q5" value="N">
                N
            </label>

            <label>
                <input type="radio" name="q5" value="E">
                E
            </label>

            <label>
                <input type="radio" name="q5" value="W">
                W
            </label>

            <label>
                <input type="radio" name="q5" value="S">
                S
            </label>
        </div>


        <!-- Q6 -->
        <div class="question">
            <h2>6.</h2>
            <h2>赤外線カメラで見えるのは</h2>
            <div class="squares">
              <span class="red"></span>
           </div>
         　<input
              type="text"
              name="q6"
             >
        </div>


        <!-- Q7 -->
        <div class="question">
            <h2>7. </h2>
            <h2>2n + 1</h2>
            <h2>
               <div class="squares">
                 <span class="red"></span>
                 <span></span>
                 <span></span>
              </div>
               (アルファベット)</h2>
            <input
              type="text"
              name="q7"
             >
        </div>


        <!-- Q8 -->
        <div class="question">
            <h2>8. </h2>

            <div class="squares">
               <span class="big"></span>
              <span></span>
               <span class="space"></span>
               
              <span class="big"></span>
               <span></span>
               <span></span>
               <span></span>
              <span class="space red"></span>

               <span></span>
               <span class="space"></span>

               <span class="big"></span>
               <span class="red"></span>
              <span></span>
               <span></span>
               <span></span>
            </div>
           
           <input
              type="text"
              name="q8"
             >
        </div>

      <h2>答えは共通の1文字 </h2>
        <button onclick="submitQuiz()">
            回答を提出する
        </button>

        <div id="result"></div>

    </div>

</div>


<script>

// ==========================
// 正解設定
// ここを後で変更する
// ==========================

const answers = {
    q1: "L",
    q2: "4",
    q3: "S",
    q4: "E",
    q5: "N",
    q6: "s",
    q7: "O",
    q8: "R"
};


// ==========================
// スタート確認
// ==========================

function startConfirmation() {

    const answer = confirm("本当に進みますか？");

    if (answer) {

        document.getElementById("startScreen").style.display = "none";
        document.getElementById("quiz").style.display = "block";

    } else {

        // いいえ → Yahoo!
        window.location.href = "https://www.yahoo.co.jp/";

    }
}


// ==========================
// 回答提出
// ==========================

function submitQuiz() {

    let score = 0;

    for (let i = 1; i <= 8; i++) {

        // radio問題か確認
        const selected = document.querySelector(
            `input[name="q${i}"]:checked`
        );

        if (selected) {

            // radioの場合
            if (
                selected.value.toLowerCase() ===
                answers[`q${i}`].toLowerCase()
            ) {
                score++;
            }

        } else {

            // text問題の場合
            const input = document.querySelector(
                `input[name="q${i}"][type="text"]`
            );

            if (
                input &&
                input.value.trim().toLowerCase() ===
                answers[`q${i}`].toLowerCase()
            ) {
                score++;
            }
        }
    }

    const result = document.getElementById("result");

    result.style.display = "block";


    // 全問正解
    if (score === 8) {

        result.innerHTML = `
            <div class="success">

                <h2>ANALYSIS COMPLETE</h2>

                <p>8 / 8</p>

                <p>SECURITY LOCK : RELEASED</p>

                <p>新しいデータが検出されました。</p>

                <a href="https://www.google.com/" target="_blank">
                    NEXT DATA
                </a>

            </div>
        `;

    }

    // 全問正解ではない
    else {

        result.innerHTML = `
            <div class="failure">

                <h2>ACCESS DENIED</h2>

                <p>${score} / 8</p>

                <p>回答が一致しません。</p>

                <p>もう一度確認してください。</p>

            </div>
        `;
    }

    // 結果までスクロール
    result.scrollIntoView({
        behavior: "smooth"
    });
}

</script>

</body>
</html>
